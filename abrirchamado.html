    <main>
        <form id="formularioChamado">
            <label for="textotitulo">Titulo:</label>
            <input type="text" name="textotitulo" id="titulo" maxlength="50">

            <label for="Emailatribuicao">Categoria:</label>
            <input type="text" name="textocategoria" id="categoria">
            
            <label for="prioridade">Prioridade:</label>

            <select name="prioridade" id="prioridade">
            <option value="Muito Alta">Muito Alta</option>
            <option value="Alta">Alta</option>
            <option value="Baixa">Baixa</option>
            </select>


            <label for="">Descrição:</label>
            <textarea name="descricao" id="descricao"></textarea>


            <button id="enviardado" type="submit">Enviar solicitação</button>
        </form>
    </main>
