<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk</title>
    <link rel="stylesheet" href="CSS/dashboard.css">
</head>

<body>

    <!-- MENU LATERAL -->
    <aside class="sidebar">

        <h1>HelpDesk</h1>

        <nav class="menu">

            <a href="dashboard.html" class="menu-item">
                <p>Home</p>
            </a>

            <a href="abrirchamado.html" class="menu-item" id="menuAbrirChamado">
                <p>Abrir chamado</p>
            </a>

            <a href="meuschamados.html" class="menu-item" id="menuMeusChamados">
                <p>Meus chamados</p>
            </a>

            <a href="#" class="menu-item" id="menuRelatorios">
                <p>Relatórios</p>
            </a>

            <a href="#" class="menu-item" id="menuConfiguracoes">
                <p>Configurações</p>
            </a>

        </nav>

        <!-- SAIR -->
        <button id="btnSair" class="btn-sair">
            <span></span>
            Sair
        </button>

    </aside>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo">

        <header class="cabecalho">

            <h2 id="saudacao">Olá!</h2>

            <p id="textotitulo">
                O que você precisa fazer?
            </p>

        </header>


        <!-- RESUMO -->
        <section class="secao-resumo">

            <h3>Resumo dos chamados</h3>

            <div class="resumo">

                <div class="card">
                    <h2 id="chamadosAbertos">0</h2>
                    <p>Abertos</p>
                </div>

                <div class="card">
                    <h2 id="chamadosAnalise">0</h2>
                    <p>Em análise</p>
                </div>

                <div class="card">
                    <h2 id="chamadosResolvidos">0</h2>
                    <p>Resolvidos</p>
                </div>

            </div>

        </section>


        <!-- CHAMADOS RECENTES -->
        <section class="chamados-recentes">

            <h3>Chamados recentes</h3>

            <div class="lista-chamados" id="listaChamados">

                <p>Nenhum chamado encontrado.</p>

            </div>

        </section>

    </main>


    <script type="module" src="dashboard.js"></script>

</body>

</html>
